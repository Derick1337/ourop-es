<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ouropães Campo — CRM Comercial</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:#f0ede8}
.app{display:flex;flex-direction:column;height:100vh;width:100vw;background:#fff;overflow:hidden}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #e0dbd2;flex-shrink:0;height:64px;background:#fff}
.topbar-left{display:flex;align-items:center;gap:14px}
.logo-img{height:48px;object-fit:contain;display:block}
.topbar-link{font-size:13px;color:#8B1A1A;text-decoration:none;font-weight:700;border:1.5px solid #f0d0d0;padding:6px 12px;border-radius:9px;transition:all .15s}
.topbar-link:hover{background:#fdf5f5;border-color:#e8b8b8}
.topbar-right{display:flex;align-items:center;gap:20px}
.topbar-sub{font-size:13px;color:#bbb;font-weight:500;letter-spacing:.02em}
.tabs{display:flex;border:1.5px solid #e0dbd2;border-radius:10px;overflow:hidden}
.tab{padding:9px 22px;font-size:14px;background:#fff;border:none;border-right:1.5px solid #e0dbd2;cursor:pointer;color:#888;transition:all .15s;font-weight:500}
.tab:last-child{border-right:none}
.tab.active{background:#8B1A1A;color:#fff;font-weight:700}

/* BODY */
.body{display:flex;flex:1;overflow:hidden;min-height:0}

/* SIDEBAR */
.sidebar{width:300px;flex-shrink:0;border-right:1px solid #e0dbd2;display:flex;flex-direction:column;overflow:hidden;background:#fff}
.sidebar-header{padding:14px 16px;border-bottom:1px solid #e0dbd2;flex-shrink:0}
.sidebar-section-title{font-size:12px;font-weight:700;color:#8B1A1A;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.legend-row{display:flex;gap:14px;flex-wrap:wrap}
.legend-item{font-size:12px;display:flex;align-items:center;gap:5px;color:#555}
.sidebar-list{flex:1;overflow-y:auto}
.cliente-item{padding:13px 16px;border-bottom:1px solid #f0ede8;cursor:pointer;transition:background .1s}
.cliente-item:hover,.cliente-item.selected{background:#fdf5f5}
.cli-top{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.dot-s{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cli-name{font-size:14px;font-weight:600;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.badge-cls{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;flex-shrink:0;white-space:nowrap}
.cli-meta{font-size:12px;color:#888;padding-left:19px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* MAP */
.map-area{flex:1;position:relative;overflow:hidden;background:#ece9e3;cursor:grab;min-width:0}
.map-area.grabbing{cursor:grabbing}
.google-map,.fallback-map{position:absolute;inset:0;width:100%;height:100%}
.map-hidden{display:none!important}
.map-canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.map-svg{display:block}
.map-hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.45);color:#fff;font-size:12px;padding:5px 14px;border-radius:20px;pointer-events:none;opacity:.7}
.add-btn{position:absolute;bottom:20px;right:20px;width:52px;height:52px;border-radius:50%;background:#8B1A1A;color:#fff;border:none;font-size:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;box-shadow:0 4px 16px rgba(139,26,26,0.4);line-height:1;font-weight:300}
.add-btn:hover{background:#a52020;transform:scale(1.05)}
.zoom-btns{position:absolute;bottom:82px;right:20px;display:flex;flex-direction:column;gap:6px;z-index:10}
.zoom-btn{width:38px;height:38px;border-radius:9px;background:#fff;border:1px solid #ddd;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#555;box-shadow:0 2px 6px rgba(0,0,0,0.12);font-weight:300}
.zoom-btn:hover{background:#f5f4f0;transform:scale(1.05)}

/* DETAIL PANEL */
.detail-panel{position:fixed;bottom:20px;left:320px;right:20px;background:#fff;border-top:3px solid #8B1A1A;padding:16px 20px;max-height:360px;overflow-y:auto;transition:transform .25s ease;box-shadow:0 -6px 24px rgba(0,0,0,0.12);z-index:900}
.detail-panel.hidden{transform:translateY(110%)}
.dp-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.dp-title{font-size:18px;font-weight:700;color:#1a1a1a}
.dp-close{background:none;border:none;cursor:pointer;color:#bbb;font-size:26px;line-height:1;padding:0 4px;transition:color .15s}
.dp-close:hover{color:#555}
.dp-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.dp-actions{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.dp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.dp-field .dp-label{font-size:11px;color:#aaa;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.dp-field .dp-val{font-size:14px;font-weight:600;color:#1a1a1a}
.obs-box{font-size:13px;color:#555;margin-bottom:12px;line-height:1.6;background:#f9f7f5;padding:10px 12px;border-radius:8px;border-left:3px solid #ddd}
.section-lbl{font-size:12px;font-weight:700;color:#8B1A1A;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;margin-top:12px}
.feedback-box{background:#fffbe6;border-radius:8px;padding:12px 14px;font-size:13px;color:#5a4a00;line-height:1.6;margin-bottom:10px;border:1px solid #f0d060}
.strat-box{background:#f0f7f0;border-radius:8px;padding:12px 14px;font-size:13px;color:#1a4a1a;line-height:1.6;margin-bottom:10px;border:1px solid #b0ddb0}
.empty-box{background:#f7f5f2;border-radius:8px;padding:12px 14px;font-size:13px;color:#aaa;line-height:1.6;margin-bottom:10px}
.prazo-row{display:flex;align-items:center;gap:12px;margin-top:4px}
.prazo-lbl{font-size:13px;color:#888;white-space:nowrap}
.prazo-row input[type=date]{font-size:13px;flex:1;padding:7px 10px;border:1px solid #e0ddd6;border-radius:7px;outline:none;max-width:200px}

/* BUTTONS */
.btn-edit{font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer;border:1.5px solid #b8d4f0;background:#e8f2fb;color:#185FA5;font-weight:700;transition:all .15s}
.btn-edit:hover{background:#d0e8f8}
.btn-del{font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer;border:1.5px solid #f0b8b8;background:#fbeaea;color:#A32D2D;font-weight:700;transition:all .15s}
.btn-del:hover{background:#f8d0d0}
.ai-btn{font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer;border:1.5px solid #b0ddb0;background:#f0f7f0;color:#1a5a1a;font-weight:700;white-space:nowrap;transition:all .15s}
.ai-btn:hover{background:#e0f0e0}

/* BADGES */
.badge-ativo{font-size:12px;padding:4px 10px;border-radius:10px;font-weight:700;background:#E1F5EE;color:#0F6E56}
.badge-prospect{font-size:12px;padding:4px 10px;border-radius:10px;font-weight:700;background:#E6F1FB;color:#185FA5}
.badge-prazo{font-size:11px;padding:3px 9px;border-radius:10px;background:#FCEBEB;color:#A32D2D;font-weight:700}

/* AI LOADING */
.ai-loading{display:flex;align-items:center;gap:7px;font-size:13px;color:#888}
.dot{width:6px;height:6px;border-radius:50%;background:#bbb;animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal-overlay.hidden{display:none!important}
.modal{background:#fff;border-radius:16px;padding:24px 26px;width:420px;max-height:92vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,0.28)}
.modal h3{font-size:17px;font-weight:700;margin-bottom:18px;color:#1a1a1a;border-bottom:3px solid #8B1A1A;padding-bottom:12px}
.mrow{margin-bottom:13px}
.mrow label{display:block;font-size:12px;color:#888;margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.mrow input,.mrow select,.mrow textarea{width:100%;font-size:14px;padding:9px 12px;border:1.5px solid #e0ddd6;border-radius:8px;outline:none;background:#fff;color:#1a1a1a;font-family:inherit;transition:border-color .15s}
.mrow input:focus,.mrow select:focus,.mrow textarea:focus{border-color:#8B1A1A}
.mrow textarea{height:64px;resize:vertical}
.msep{font-size:12px;font-weight:700;color:#8B1A1A;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 10px;border-top:1px solid #f0ede8;padding-top:14px}
.mbtns{display:flex;gap:10px;margin-top:18px}
.mbtn-save{flex:1;background:#8B1A1A;color:#fff;border:none;border-radius:9px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s}
.mbtn-save:hover{background:#a52020}
.mbtn-cancel{padding:12px 20px;border:1.5px solid #e0ddd6;border-radius:9px;background:#fff;font-size:14px;cursor:pointer;color:#888;font-weight:600;transition:background .15s}
.mbtn-cancel:hover{background:#f5f4f0}

/* PAINEL */
.dash-page{padding:24px;overflow-y:auto;flex:1}
.dash-title{font-size:20px;font-weight:700;color:#1a1a1a;margin-bottom:20px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.mcard{background:#f9f7f5;border-radius:12px;padding:16px 18px;border-left:5px solid #ddd}
.mcard.mc-all{border-left-color:#8B1A1A}
.mcard.mc-a{border-left-color:#1D9E75}
.mcard.mc-b{border-left-color:#EF9F27}
.mcard.mc-c{border-left-color:#E24B4A}
.mcard-val{font-size:30px;font-weight:700;color:#1a1a1a}
.mcard-lbl{font-size:13px;color:#888;margin-top:3px;font-weight:500}
.table-wrap{border:1px solid #e8e5de;border-radius:12px;overflow:hidden}
.dt{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
.dt th{padding:12px 14px;text-align:left;font-weight:700;font-size:12px;color:#888;border-bottom:1px solid #e8e5de;background:#f7f5f2;text-transform:uppercase;letter-spacing:.04em}
.dt td{padding:12px 14px;border-bottom:1px solid #f0ede8;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.dt tr:last-child td{border-bottom:none}
.dt tr:hover td{background:#fdf9f9}

/* RESPONSIVIDADE PARA O TELEMÓVEL (MOBILE) */
@media (max-width: 768px) {
  .body { flex-direction: column-reverse; }
  .sidebar { width: 100%; height: 45%; border-right: none; border-top: 2px solid #e0dbd2; }
  .detail-panel { left: 12px; right: 12px; bottom: 12px; max-height: 50vh; }
  .modal { width: 95%; padding: 16px; }
  .dp-grid { grid-template-columns: 1fr 1fr; }
  .topbar-sub { display: none; }
  .metrics { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-left">
      <img class="logo-img" id="logo-img" alt="Ouropães Congelados">
      <a class="topbar-link" href="ouropoes_pitch.html">Pitch</a>
    </div>
    <div class="topbar-right">
      <span class="topbar-sub">CRM Comercial · MVP Hackathon</span>
      <div class="tabs">
        <button class="tab active" id="tab-btn-mapa" onclick="switchTab('mapa')">📍 Mapa</button>
        <button class="tab" id="tab-btn-dash" onclick="switchTab('dash')">📊 Painel</button>
      </div>
    </div>
  </div>

  <div id="tab-mapa" class="body">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-section-title">Estabelecimentos</div>
        <div class="legend-row">
          <span class="legend-item"><span style="width:10px;height:10px;border-radius:50%;background:#1D9E75;display:inline-block"></span>Alta viabilidade</span>
          <span class="legend-item"><span style="width:10px;height:10px;border-radius:50%;background:#EF9F27;display:inline-block"></span>Média</span>
          <span class="legend-item"><span style="width:10px;height:10px;border-radius:50%;background:#E24B4A;display:inline-block"></span>Baixa</span>
        </div>
      </div>
      <div class="sidebar-list" id="sidebar-list"></div>
    </div>
    <div class="map-area" id="map-area">
      <div class="google-map" id="google-map"></div>
      <div class="fallback-map map-hidden" id="fallback-map">
        <div class="map-canvas" id="map-canvas">
          <svg class="map-svg" id="map-svg" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <div class="map-hint">Arraste para mover · Scroll para zoom</div>
        <div class="zoom-btns">
          <button class="zoom-btn" onclick="zoomMap(1.2)">+</button>
          <button class="zoom-btn" onclick="zoomMap(0.83)">−</button>
          <button class="zoom-btn" onclick="resetView()" style="font-size:15px">⌂</button>
        </div>
      </div>
      <button class="add-btn" id="add-btn" title="Cadastrar novo estabelecimento">+</button>
      <div class="detail-panel hidden" id="detail-panel"></div>
    </div>
  </div>

  <div id="tab-dash" style="display:none;flex:1;overflow:hidden;">
    <div class="dash-page">
      <div class="dash-title">Visão geral comercial</div>
      <div class="metrics" id="dash-metrics"></div>
      <div style="font-size:12px;font-weight:700;color:#aaa;margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em">Todos os estabelecimentos</div>
      <div class="table-wrap"><table class="dt" id="dash-table"></table></div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal">
      <h3 id="modal-title">📍 Novo estabelecimento</h3>
      <div class="mrow"><label>Nome fantasia *</label><input type="text" id="m-nome" placeholder="Ex: Mercadinho do Zé"></div>
      <div class="mrow"><label>CNPJ</label><input type="text" id="m-cnpj" placeholder="00.000.000/0001-00"></div>
      <div class="mrow"><label>Razão Social</label><input type="text" id="m-razao" placeholder="Ex: José Silva ME"></div>
      <div class="mrow"><label>Situação do cliente</label>
        <select id="m-tipo">
          <option value="prospect">Em prospecção (ainda não é cliente)</option>
          <option value="ativo">Cliente ativo (já compra da Ouropães)</option>
        </select>
      </div>
      <div class="msep">Informações comerciais</div>
      <div class="mrow"><label>Produtos de interesse / comercializados</label><input type="text" id="m-prod" placeholder="Pão francês, croissant, pão de queijo..."></div>
      <div class="mrow"><label>Fornecedor atual / concorrente</label><input type="text" id="m-forn" placeholder="Nome do fornecedor atual"></div>
      <div class="mrow"><label>Preço praticado (R$/kg)</label><input type="number" id="m-preco" placeholder="Ex: 12.50" step="0.01"></div>
      <div class="mrow"><label>Equipamentos em comodato</label><input type="text" id="m-equip" placeholder="Freezer, estufa..."></div>
      <div class="mrow"><label>Demanda estimada</label>
        <select id="m-dem"><option>Baixa</option><option>Média</option><option selected>Alta</option></select>
      </div>
      <div class="mrow"><label>Viabilidade comercial</label>
        <select id="m-cls">
          <option value="A">Alta viabilidade</option>
          <option value="B">Média viabilidade</option>
          <option value="C">Baixa viabilidade</option>
        </select>
      </div>
      <div class="mrow"><label>Observações de campo</label><textarea id="m-obs" placeholder="Anotações do consultor na visita..."></textarea></div>
      <div class="msep">Retorno do cliente ativo</div>
      <div class="mrow"><label>Retorno / satisfação do cliente</label><textarea id="m-feedback" placeholder="Ex: Cliente satisfeito com a entrega. Pediu mais variedade. Solicitou prazo maior de pagamento..."></textarea></div>
      <div class="mbtns">
        <button class="mbtn-save" id="modal-save-btn" onclick="saveForm()">Salvar estabelecimento</button>
        <button class="mbtn-cancel" onclick="closeModal()">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<script>
var CC={A:'#1D9E75',B:'#EF9F27',C:'#E24B4A'};
var CB={A:'#E1F5EE',B:'#FAEEDA',C:'#FCEBEB'};
var CT={A:'#0F6E56',B:'#854F0B',C:'#A32D2D'};
var CL={A:'Alta viabilidade',B:'Média viabilidade',C:'Baixa viabilidade'};

var DEFAULT_CENTER = {lat:-32.035,lng:-52.098};
var map = null;
var markers = [];
var tempLat = null;
var tempLng = null;
var mapMode = 'leaflet';

var API_KEY = localStorage.getItem('ANTHROPIC_API_KEY') || null;
var API_BASE = 'http://localhost:8000';
var USE_API = true;

function apiRequest(path, options) {
  if(!USE_API) return Promise.resolve(null);
  var opts = options || {};
  opts.headers = opts.headers || {};
  if(opts.body && !opts.headers['Content-Type']) opts.headers['Content-Type'] = 'application/json';
  return fetch(API_BASE + path, opts).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.status===204 ? null : r.json();
  });
}

function getApiKey() {
  if(API_KEY) return API_KEY;
  var stored = localStorage.getItem('ANTHROPIC_API_KEY');
  if(stored) {
    API_KEY = stored;
    return API_KEY;
  }
  return null;
}

function loadPontos() {
  return apiRequest('/pontos').then(function(list){
    if(Array.isArray(list)){
      pontos = list;
      renderMarkers();
      renderSidebar();
      if(document.getElementById('tab-btn-dash').classList.contains('active')) renderDash();
    }
  }).catch(function(erro){
    console.error('Erro ao ligar à API. Certifique-se de que o servidor Python está a correr.', erro);
  });
}

function showPrimaryMap() {
  var googleMap = document.getElementById('google-map');
  var fallbackMap = document.getElementById('fallback-map');
  if(googleMap) googleMap.classList.remove('map-hidden');
  if(fallbackMap) fallbackMap.classList.add('map-hidden');
}

function showFallbackMap() {
  var googleMap = document.getElementById('google-map');
  var fallbackMap = document.getElementById('fallback-map');
  if(googleMap) googleMap.classList.add('map-hidden');
  if(fallbackMap) fallbackMap.classList.remove('map-hidden');
}

function loadMapProvider() {
  if(window.L && window.L.map){
    initLeafletMap();
    return;
  }
  if(!window.L){
    var cssId = 'leaflet-css';
    if(!document.getElementById(cssId)) {
      var link = document.createElement('link');
      link.id = cssId;
      link.rel = 'stylesheet';
      link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
      document.head.appendChild(link);
    }
    var scriptId = 'leaflet-js';
    if(document.getElementById(scriptId)) return;
    var script = document.createElement('script');
    script.id = scriptId;
    script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    script.onload = initLeafletMap;
    script.onerror = function(){
      initFallbackMap();
    };
    document.body.appendChild(script);
    return;
  }
  if(!window.L || !window.L.map){
    initFallbackMap();
    return;
  }
}

function initLeafletMap() {
  mapMode = 'leaflet';
  showPrimaryMap();
  var leafletMapEl = document.getElementById('google-map');
  if(!leafletMapEl || !window.L || !window.L.map) return;
  if(map) {
    map.remove();
    map = null;
  }
  map = L.map(leafletMapEl, { zoomControl: true, preferCanvas: true }).setView([DEFAULT_CENTER.lat, DEFAULT_CENTER.lng], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);
  map.on('click', function(event) {
    tempLat = event.latlng.lat;
    tempLng = event.latlng.lng;
    selected = null;
    renderMarkers();
    openModal(null);
  });
  renderMarkers();
}

function initFallbackMap() {
  mapMode = 'fallback';
  showFallbackMap();
  renderMarkers();
}

function renderMarkers() {
  if(mapMode === 'leaflet') {
    if(!map || !window.L || !window.L.circleMarker) return;
    markers.forEach(function(m) { map.removeLayer(m); });
    markers = [];
    pontos.forEach(function(p) {
      if(p.x === null || p.x === undefined || p.y === null || p.y === undefined || p.x === '' || p.y === '') return;
      var corPino = CC[p.cls] || '#8B1A1A';
      var coords = [parseFloat(p.x), parseFloat(p.y)];
      var visualMarker = L.circleMarker(coords, {
        radius: selected===p.id ? 13 : 10,
        color: '#FFFFFF',
        weight: 2,
        fillColor: corPino,
        fillOpacity: 1,
        opacity: 1,
        interactive: false
      });
      visualMarker.addTo(map);
      var hitMarker = L.circleMarker(coords, {
        radius: selected===p.id ? 26 : 22,
        color: corPino,
        weight: 0,
        fillColor: corPino,
        fillOpacity: 0,
        opacity: 0,
        bubblingMouseEvents: false,
        interactive: true
      });
      hitMarker.addTo(map);
      hitMarker.bindTooltip(p.nome, {direction:'top', offset:[0,-8], opacity:0.95});
      hitMarker.on('click', function(event) {
        if(event && event.originalEvent) L.DomEvent.stop(event.originalEvent);
        selectPonto(p.id);
      });
      markers.push(visualMarker);
      markers.push(hitMarker);
    });
    return;
  }
  renderFallbackMap();
}

function renderFallbackMap() {
  showFallbackMap();
  var svg = document.getElementById('map-svg');
  if(!svg) return;
  svg.setAttribute('width', SVG_W);
  svg.setAttribute('height', SVG_H);
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  function el(tag, attrs, parent) {
    var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for(var k in attrs) e.setAttribute(k, attrs[k]);
    if(parent) parent.appendChild(e);
    return e;
  }
  el('rect',{width:SVG_W,height:SVG_H,fill:'#ece9e3'},svg);
  [[0,300,SVG_W,300,10],[0,190,SVG_W,190,5],[0,430,SVG_W,430,5],[0,560,SVG_W,560,3],[0,90,SVG_W,90,3],
   [270,0,270,SVG_H,10],[490,0,490,SVG_H,5],[130,0,130,SVG_H,5],[650,0,650,SVG_H,3]
  ].forEach(function(r){el('line',{x1:r[0],y1:r[1],x2:r[2],y2:r[3],stroke:'#d6d0c8','stroke-width':r[4]},svg);});
  [['Av. Principal',278,286],['Rua das Flores',278,176],['Rua do Comércio',278,416],['Rua dos Trabalhadores',278,547]
  ].forEach(function(l){var t=el('text',{x:l[1],y:l[2],'font-size':'12',fill:'#c0b8ae','font-family':'Segoe UI,Arial,sans-serif'},svg);t.textContent=l[0];});
  pontos.forEach(function(p) {
    var sel = selected===p.id;
    var isAtivo = p.tipo==='ativo';
    var g = el('g',{style:'cursor:pointer'},svg);
    g.setAttribute('onclick','selectPonto('+p.id+')');
    el('circle',{cx:p.x,cy:p.y,r:sel?30:20,fill:CC[p.cls],opacity:'0.18'},g);
    el('circle',{cx:p.x,cy:p.y,r:sel?16:12,fill:CC[p.cls]},g);
    if(isAtivo) {
      el('circle',{cx:p.x,cy:p.y,r:sel?10:7,fill:'#fff',opacity:'0.6'},g);
    }
    if(sel) el('circle',{cx:p.x,cy:p.y,r:'23',fill:'none',stroke:CC[p.cls],'stroke-width':'2.5'},g);
    var t=el('text',{x:p.x,y:p.y+32,'text-anchor':'middle','font-size':'12',fill:'#333','font-family':'Segoe UI,Arial,sans-serif','font-weight':sel?'700':'500'},g);
    t.textContent=p.nome.split(' ').slice(0,2).join(' ');
  });
}

function renderSidebar() {

function closeDetail(){selected=null;document.getElementById('detail-panel').classList.add('hidden');renderMarkers();renderSidebar();}
function deletePonto(id){
  if(!confirm('Excluir este estabelecimento?'))return;
  var doLocal = function(){
    pontos=pontos.filter(function(p){return p.id!==id;});
    closeDetail();
  };
  apiRequest('/pontos/'+id,{method:'DELETE'}).then(function(){
    doLocal();
  }).catch(function(){
    doLocal();
  });
}
function setPrazo(id,val){
  var p=pontos.find(function(x){return String(x.id)===String(id);});
  if(p)p.prazo=val;
  renderSidebar();
  if(p){
    apiRequest('/pontos/'+id,{method:'PUT',body:JSON.stringify(p)}).catch(function(){});
  }
}

function gerarEstrategia(id) {
  var p=pontos.find(function(x){return String(x.id)===String(id);});
  var box=document.getElementById('strat-box-'+id);
  if(!box)return;
  var key = getApiKey();
  if(!key){box.className='empty-box';box.textContent='⚠️ Insira sua API_KEY para usar esta funcionalidade.';return;}
  box.className='empty-box';
  box.innerHTML='<div class="ai-loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div> Gerando estratégia...</div>';
  var prompt='Você é consultor de vendas da Ouropães Congelados (fabricante de pães congelados). Com base nos dados abaixo, escreva UMA estratégia comercial objetiva (máximo 3 frases) para a próxima visita. Sem markdown, sem tópicos.\n\n';
  prompt+='Estabelecimento: '+p.nome+' | Situação: '+(p.tipo==='ativo'?'Cliente ativo':'Em prospecção')+' | Viabilidade: '+CL[p.cls]+' | Demanda: '+p.dem+' | Fornecedor: '+(p.forn||'não identificado')+' | Preço: '+(p.preco?'R$ '+p.preco+'/kg':'não informado')+' | Produtos: '+(p.prod||'não identificado')+' | Equipamentos: '+(p.equip||'nenhum')+' | Obs: '+(p.obs||'nenhuma')+(p.feedback?' | Retorno do cliente: '+p.feedback:'');
  fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,messages:[{role:'user',content:prompt}]})
  }).then(function(r){return r.json();}).then(function(data){
    var txt=data.content.map(function(i){return i.text||'';}).join('');
    p.estrategia=txt;box.className='strat-box';box.textContent=txt;renderSidebar();
  }).catch(function(e){box.className='empty-box';box.textContent='Erro: '+e.message;});
}

function openModal(id) {
  editingId=(id!==undefined&&id!==null)?id:null;
  var isEdit=editingId!==null;
  document.getElementById('modal-title').textContent=isEdit?'✏️ Editar estabelecimento':'📍 Novo estabelecimento';
  document.getElementById('modal-save-btn').textContent=isEdit?'Salvar alterações':'Salvar estabelecimento';
  if(isEdit){
    var p=pontos.find(function(x){return String(x.id)===String(editingId);});
    document.getElementById('m-nome').value=p.nome||'';
    document.getElementById('m-cnpj').value=p.cnpj||'';
    document.getElementById('m-razao').value=p.razao||'';
    document.getElementById('m-tipo').value=p.tipo||'prospect';
    document.getElementById('m-prod').value=p.prod||'';
    document.getElementById('m-forn').value=p.forn||'';
    document.getElementById('m-preco').value=p.preco||'';
    document.getElementById('m-equip').value=p.equip||'';
    document.getElementById('m-dem').value=p.dem||'Alta';
    document.getElementById('m-cls').value=p.cls||'A';
    document.getElementById('m-obs').value=p.obs||'';
    document.getElementById('m-feedback').value=p.feedback||'';
  } else {
    ['m-nome','m-cnpj','m-razao','m-prod','m-forn','m-preco','m-equip','m-obs','m-feedback'].forEach(function(i){document.getElementById(i).value='';});
    document.getElementById('m-dem').value='Alta';document.getElementById('m-cls').value='A';document.getElementById('m-tipo').value='prospect';
  }
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal(){document.getElementById('modal-overlay').classList.add('hidden');editingId=null;tempLat=null;tempLng=null;}

function saveForm() {
  var nome=document.getElementById('m-nome').value.trim();
  if(!nome){alert('Informe o nome fantasia.');return;}
  var btn = document.getElementById('modal-save-btn');
  var textoOriginal = btn.textContent;
  btn.textContent = 'A guardar...';
  btn.disabled = true;
  btn.style.opacity = '0.7';

  var data={nome:nome,cnpj:document.getElementById('m-cnpj').value.trim(),razao:document.getElementById('m-razao').value.trim(),tipo:document.getElementById('m-tipo').value,prod:document.getElementById('m-prod').value.trim(),forn:document.getElementById('m-forn').value.trim(),preco:document.getElementById('m-preco').value.trim(),equip:document.getElementById('m-equip').value.trim(),dem:document.getElementById('m-dem').value,cls:document.getElementById('m-cls').value,obs:document.getElementById('m-obs').value.trim(),feedback:document.getElementById('m-feedback').value.trim()};

  var finaliza = function() {
    btn.textContent = textoOriginal;
    btn.disabled = false;
    btn.style.opacity = '1';
    closeModal();
    renderMarkers();
    renderSidebar();
  };

  if(editingId!==null){
    var currentId = editingId;
    var p=pontos.find(function(x){return String(x.id)===String(currentId);});
    if(!p){
      finaliza();
      return;
    }
    Object.assign(p,data);
    apiRequest('/pontos/'+currentId,{method:'PUT',body:JSON.stringify(p)}).then(function(remote){
      if(remote) Object.assign(p,remote);
      finaliza();
      selectPonto(p.id);
    }).catch(function(){
      finaliza();
      selectPonto(p.id);
    });
  } else {
    var payload=Object.assign({estrategia:'',prazo:'',x:tempLat!==null?tempLat:DEFAULT_CENTER.lat,y:tempLng!==null?tempLng:DEFAULT_CENTER.lng},data);
    apiRequest('/pontos',{method:'POST',body:JSON.stringify(payload)}).then(function(remote){
      pontos.push(remote||Object.assign({id:Date.now()},payload));
      finaliza();
    }).catch(function(){
      pontos.push(Object.assign({id:Date.now()},payload));
      finaliza();
    });
  }
}

function applyTransform(){var canvas=document.getElementById('map-canvas');if(canvas) canvas.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';}
function zoomMap(f){if(mapMode==='leaflet')return;var a=document.getElementById('map-area');var cx=a.clientWidth/2,cy=a.clientHeight/2;panX=(panX-cx)*f+cx;panY=(panY-cy)*f+cy;scale*=f;applyTransform();}
function resetView(){if(mapMode==='leaflet')return;panX=0;panY=0;scale=1;applyTransform();}

var mapArea=document.getElementById('map-area');
mapArea.addEventListener('mousedown',function(e){
  if(mapMode==='leaflet')return;
  if(e.target.closest&&(e.target.closest('g')||e.target.closest('button')))return;
  dragging=true;lastMX=e.clientX;lastMY=e.clientY;mapArea.classList.add('grabbing');
});
window.addEventListener('mousemove',function(e){if(mapMode==='leaflet'||!dragging)return;panX+=e.clientX-lastMX;panY+=e.clientY-lastMY;lastMX=e.clientX;lastMY=e.clientY;applyTransform();});
window.addEventListener('mouseup',function(){if(mapMode==='leaflet')return;dragging=false;mapArea.classList.remove('grabbing');});
mapArea.addEventListener('wheel',function(e){if(mapMode==='leaflet')return;e.preventDefault();var f=e.deltaY<0?1.1:0.91;var r=mapArea.getBoundingClientRect();var cx=e.clientX-r.left,cy=e.clientY-r.top;panX=(panX-cx)*f+cx;panY=(panY-cy)*f+cy;scale*=f;applyTransform();},{passive:false});
mapArea.addEventListener('touchstart',function(e){if(mapMode==='leaflet')return;if(e.touches.length===1){lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY;}},{passive:true});
mapArea.addEventListener('touchmove',function(e){if(mapMode==='leaflet')return;if(e.touches.length===1){panX+=e.touches[0].clientX-lastMX;panY+=e.touches[0].clientY-lastMY;lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY;applyTransform();}},{passive:true});
